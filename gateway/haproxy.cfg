# Secure Proxy Failover Lab - egress gateway
#
# Clients send their outbound traffic here. The gateway spreads it over 20 exit
# proxies, drops dead ones, falls back to a reserve pool, and if nothing is left
# it refuses the traffic (fail closed) instead of letting it out some other way.

global
    log stdout format raw local0
    maxconn 4096
    # Runtime API, loopback only. scripts/killswitch.sh talks to this.
    stats socket ipv4@127.0.0.1:9999 level admin

defaults
    mode tcp
    log global
    option tcplog
    option dontlognull

    # If an exit proxy doesn't answer, try another one instead of failing the client.
    retries 3
    option redispatch 1

    timeout connect 1s
    timeout client  30s
    timeout server  30s
    timeout check   1s

    # check inter 1s fall 2 rise 2   -> test every proxy once a second; 2 misses = out, 2 passes = back
    # observe layer4 / on-error      -> also pull a proxy after 2 failed real connections in a row
    # resolvers / init-addr          -> start even if a proxy is offline, follow container IP changes
    default-server check inter 1s fall 2 rise 2 observe layer4 error-limit 2 on-error mark-down resolvers docker init-addr last,libc,none

resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid      5s
    hold nx         2s
    hold obsolete   2s

frontend fe_egress
    bind :3128
    # Only the client network may use the gateway.
    tcp-request connection reject unless { src 172.30.1.0/24 }
    default_backend be_egress

backend be_egress
    balance roundrobin
    # Use every reserve proxy once the primaries are gone, not just the first one.
    option allbackups

    # Health check goes THROUGH each proxy to the outside. A proxy that is running
    # but can't reach the outside world is treated as dead.
    option httpchk
    http-check send meth GET uri http://target/healthz ver HTTP/1.1 hdr Host target
    http-check expect status 200

    # Primary pool
    server egress-01 egress-01:8888
    server egress-02 egress-02:8888
    server egress-03 egress-03:8888
    server egress-04 egress-04:8888
    server egress-05 egress-05:8888
    server egress-06 egress-06:8888
    server egress-07 egress-07:8888
    server egress-08 egress-08:8888
    server egress-09 egress-09:8888
    server egress-10 egress-10:8888
    server egress-11 egress-11:8888
    server egress-12 egress-12:8888
    server egress-13 egress-13:8888
    server egress-14 egress-14:8888
    server egress-15 egress-15:8888
    server egress-16 egress-16:8888

    # Reserve pool: idle until every primary proxy is down
    server egress-17 egress-17:8888 backup
    server egress-18 egress-18:8888 backup
    server egress-19 egress-19:8888 backup
    server egress-20 egress-20:8888 backup

listen stats
    mode http
    bind :8404
    stats enable
    stats uri /stats
    stats refresh 2s
    stats show-legends
