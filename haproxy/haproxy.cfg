# Secure Proxy Failover Lab - HAProxy edge configuration
# TLS termination, path-based routing, active health checks, backup-server failover.

global
    log stdout format raw local0
    maxconn 2048
    # Refuse anything older than TLS 1.2 and disable session tickets.
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option forwardfor

    # Resilience: if a connection to a server fails, retry on a DIFFERENT server
    # straight away instead of returning an error to the client.
    retries 2
    option redispatch 1

    timeout connect 1s
    timeout client  30s
    timeout server  30s
    timeout check   1s

    # Applied to every "server" line below:
    #   check / inter 2s / fall 2 / rise 2 -> probe every 2s, 2 failures = DOWN, 2 passes = UP
    #   observe layer4 + on-error mark-down -> also learn from live traffic: 2 consecutive
    #                                          connection errors mark the server DOWN at once
    #   resolvers + init-addr              -> start even if a backend is offline, and follow
    #                                          container IP changes via Docker DNS
    default-server check inter 2s fall 2 rise 2 observe layer4 error-limit 2 on-error mark-down resolvers docker init-addr last,libc,none

# Docker's embedded DNS server, so HAProxy re-resolves containers that restart.
resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid      5s
    hold nx         2s
    hold obsolete   2s

# --- Plain HTTP: redirect everything to HTTPS ---------------------------------
frontend fe_http
    bind :8080
    http-request redirect location https://%[hdr(host),field(1,:)]:8443%[pathq] code 301

# --- HTTPS edge ---------------------------------------------------------------
frontend fe_https
    bind :8443 ssl crt /usr/local/etc/haproxy/certs/lab.pem alpn h2,http/1.1

    # Per-client rate limit: more than 200 requests in 10s gets HTTP 429.
    stick-table type ipv6 size 100k expire 30s store http_req_rate(10s)
    http-request track-sc0 src
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 200 }

    # Security headers; hide backend software details.
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"
    http-response set-header X-Content-Type-Options "nosniff"
    http-response set-header X-Frame-Options "DENY"
    http-response del-header Server

    # Shows which backend answered - handy for watching failover happen.
    http-response set-header X-Served-By "%s"

    # Traffic routing: /api goes to the API pool, everything else to the web pool.
    acl is_api path_beg /api
    use_backend be_api if is_api
    default_backend be_web

# --- Web pool: two active nodes (load-balanced) + one disaster-recovery node --
backend be_web
    balance roundrobin
    option httpchk
    http-check send meth GET uri /healthz
    http-check expect status 200
    server web1   web1:80
    server web2   web2:80
    server web-dr web-dr:80 backup   # only receives traffic when web1 AND web2 are down

# --- API pool: classic active / standby ---------------------------------------
backend be_api
    option httpchk
    http-check send meth GET uri /healthz
    http-check expect status 200
    server api-primary api-primary:80
    server api-standby api-standby:80 backup

# --- Live dashboard (published on localhost only) -----------------------------
listen stats
    bind :8404
    stats enable
    stats uri /stats
    stats refresh 2s
    stats show-legends
