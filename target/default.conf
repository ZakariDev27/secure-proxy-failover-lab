# Stands in for a site on the internet. It answers with the name of the exit
# proxy the request came through, or DIRECT if it didn't come through one.
map $http_x_exit_node $exit_node {
    default $http_x_exit_node;
    ""      "DIRECT";
}

server {
    listen 80;
    server_tokens off;
    default_type text/plain;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 200 "$exit_node\n";
    }
}
